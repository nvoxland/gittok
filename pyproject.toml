[project]
name = "gittok"
version = "0.1.0"
description = "A personal TikTok-style feed for understanding your own codebases"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "mcp>=2.3",
  "httpx>=0.27",
  "regex>=2024.11",
  "tree-sitter-language-pack>=1.22,<1.23",  # structure layer
  "ast-grep-py",  # ast_grep rules in repo profiles
]

[project.scripts]
gittok = "gittok.cli:main"

[project.optional-dependencies]
# For `uv tool install 'gittok[images]'`. The group below is for developers.
images = ["mflux; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
images = ["mflux"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gittok"]

# Shared product files live inside the package, so an installed app needs no clone.
[tool.hatch.build.targets.wheel.force-include]
"config" = "gittok/_bundled/config"
"web/build" = "gittok/_bundled/web"
".claude/skills/gittok-generate" = "gittok/_bundled/claude/skills/gittok-generate"
".claude/skills/gittok-steer" = "gittok/_bundled/claude/skills/gittok-steer"
".claude/skills/gittok-profile-repo" = "gittok/_bundled/claude/skills/gittok-profile-repo"
".claude/agents/gittok-writer.md" = "gittok/_bundled/claude/agents/gittok-writer.md"
".claude/agents/gittok-scout.md" = "gittok/_bundled/claude/agents/gittok-scout.md"

# `uv build` makes the wheel from the sdist, so the sdist carries the same files.
[tool.hatch.build.targets.sdist]
include = ["/src", "/config", "/.claude/skills", "/.claude/agents", "/hatch_build.py", "/docs", "/README*", "/AGENTS.md", "/SPEC.md"]
artifacts = ["/web/build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real repo or Claude session; skipped unless GITTOK_LIVE=1"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
