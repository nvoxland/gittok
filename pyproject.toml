[project]
name = "gittok"
version = "1.2.0"
description = "A personal TikTok-style feed for understanding your own codebases"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Voxland" }]
requires-python = ">=3.13"
keywords = ["git", "code-understanding", "claude-code", "mcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "fastapi>=0.115",
  "starlette>=0.40",  # imported directly (responses, static files)
  "pydantic>=2.7",  # imported directly (request bodies)
  "uvicorn>=0.32",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "regex>=2024.11",
  "tree-sitter>=0.25",  # structure layer
  "tree-sitter-language-pack>=1.22,<1.23",  # its grammars
  "ast-grep-py>=0.51",  # ast_grep rules in repo profiles
  "pillow>=11",  # draws meme cards (memes.py)
]

[project.scripts]
gittok = "gittok.cli:main"

[project.optional-dependencies]
# For `uv tool install 'gittok[images]'`. The group below is for developers.
images = ["mflux>=0.24; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
images = ["mflux>=0.24"]
dev = ["pytest>=8", "pytest-xdist>=3.6", "httpx>=0.27", "ruff>=0.8", "anyio>=4", "hatchling"]
# The docs site (mkdocs.yml): `uv run --group docs mkdocs serve`. Not installed by default.
# click<8.3: newer click breaks `mkdocs serve` auto-reload.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10",
    "mkdocs-autorefs>=1.4",
    "click<8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gittok"]

# Shared product files live inside the package, so an installed app needs no clone.
# The web build is added by hatch_build.py, so a clone without it still installs for development.
[tool.hatch.build.targets.wheel.force-include]
"config" = "gittok/_bundled/config"
".claude/skills/gittok-generate" = "gittok/_bundled/claude/skills/gittok-generate"
".claude/skills/gittok-steer" = "gittok/_bundled/claude/skills/gittok-steer"
".claude/skills/gittok-profile-repo" = "gittok/_bundled/claude/skills/gittok-profile-repo"
".claude/agents/gittok-writer.md" = "gittok/_bundled/claude/agents/gittok-writer.md"
".claude/agents/gittok-scout.md" = "gittok/_bundled/claude/agents/gittok-scout.md"

# `uv build` makes the wheel from the sdist, so the sdist carries the same files.
[tool.hatch.build.targets.sdist]
include = ["/src", "/config", "/.claude/skills", "/.claude/agents", "/hatch_build.py", "/docs", "/README*", "/LICENSE", "/AGENTS.md", "/DEV.md", "/SPEC.md"]
artifacts = ["/web/build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real repo or Claude session; skipped unless GITTOK_LIVE=1"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
