[project]
name = "blamescroll"
version = "0.1.0"
description = "A personal TikTok-style feed for understanding your own codebases"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "mcp>=2.3",
  "httpx>=0.27",
  "regex>=2024.11",
]

[project.scripts]
blamescroll = "blamescroll.cli:main"

[project.optional-dependencies]
# For `uv tool install 'blamescroll[structure,profiles]'`. The groups below are for developers.
images = ["mflux; sys_platform == 'darwin' and platform_machine == 'arm64'"]
profiles = ["ast-grep-py"]
structure = ["tree-sitter-language-pack>=1.22,<1.23"]

[dependency-groups]
images = ["mflux"]
profiles = ["ast-grep-py"]  # optional: ast_grep rules in config/profiles/*.yaml
structure = ["tree-sitter-language-pack>=1.22,<1.23"]  # optional: tree-sitter structure layer
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blamescroll"]

# Shared product files live inside the package, so an installed app needs no clone.
[tool.hatch.build.targets.wheel.force-include]
"config" = "blamescroll/_bundled/config"
"web/build" = "blamescroll/_bundled/web"
".claude/skills/blamescroll-generate" = "blamescroll/_bundled/claude/skills/blamescroll-generate"
".claude/skills/blamescroll-steer" = "blamescroll/_bundled/claude/skills/blamescroll-steer"
".claude/skills/blamescroll-profile-repo" = "blamescroll/_bundled/claude/skills/blamescroll-profile-repo"
".claude/agents/blamescroll-writer.md" = "blamescroll/_bundled/claude/agents/blamescroll-writer.md"
".claude/agents/blamescroll-scout.md" = "blamescroll/_bundled/claude/agents/blamescroll-scout.md"

# `uv build` makes the wheel from the sdist, so the sdist carries the same files.
[tool.hatch.build.targets.sdist]
include = ["/src", "/config", "/.claude/skills", "/.claude/agents", "/hatch_build.py", "/docs", "/README*", "/AGENTS.md", "/SPEC.md"]
artifacts = ["/web/build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real repo or Claude session; skipped unless BLAMESCROLL_LIVE=1"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
