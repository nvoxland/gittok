site_name: GitTok
site_description: Doomscrolling your code. A TikTok-style feed about your own git repos.
site_author: Nathan Voxland
site_url: https://nvoxland.github.io/gittok/
repo_name: nvoxland/gittok
repo_url: https://github.com/nvoxland/gittok
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
dev_addr: '0.0.0.0:8000'

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Install: getting-started/install.md
      - Your first feed: getting-started/first-feed.md
  - Guide:
      - Repos: guide/repos.md
      - Cards: guide/cards.md
      - Steer the feed: guide/steering.md
      - How the feed learns: guide/learning.md
      - Keep the feed full: guide/keeping-full.md
      - Privacy and your network: guide/privacy.md
      - Your GitTok directory: guide/files.md
      - Upgrade and uninstall: guide/upgrade.md
      - Configuration: config.md
      - Advanced setup: install.md
      - Card formats in depth: formats.md
      - Learning in depth: learning.md
      - Scheduling in depth: scheduling.md
      - Stories, notifications, offline: social.md
      - Feed API: api.md
  - Blog:
      - blog/index.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - autorefs
  - blog:
      blog_dir: blog
      post_date_format: long
      archive: true
      categories: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  generator: false
  analytics:
    provider: google
    property: G-SE6XDQX7D1
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nvoxland/gittok
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gittok/

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Nathan Voxland
