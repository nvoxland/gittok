# The shipped settings. Do not edit: write the keys you change to local/settings.yaml of your
# GitTok directory (docs/config.md). Nothing here is about one computer: hosts are loopback,
# and paths are inside the GitTok directory or under ~/.cache.
data_dir: data                 # relative to the GitTok directory, or absolute / ~
server:
  host: 127.0.0.1
  port: 7313
  lan: true                    # serve the feed to the local network, for a phone (plain HTTP; each device pairs once). false: this computer only
  allowed_hosts: []            # extra Host names the server answers to, such as a VPN name
agent:
  default_count: 10            # cards per get_brief
  max_count: 20                # get_brief refuses larger counts
  per_day_runs: 10             # get_brief refuses to open more runs per day
  packet_size: 2               # cards per work packet (1-5)
  target_runway_days: 3        # get_brief makes cards until the unseen backlog lasts this long
  wake_cooldown_hours: 4       # least time between two feed-watch signals (data/feed-wants-cards.log); an empty feed does not wait
  min_burn_per_day: 10         # cards per day assumed at least, so a quiet week does not starve
  min_run_count: 8             # a run that is needed makes at least this many (start-up cost)
  lead_cooldown_days: 30       # a lead covered by a card is not offered again for this long
  subject_cooldown_days: 14    # a commit or file is the main subject of at most one card per this many days, whatever the story type
  min_spot_the_bug_per_run: 0.125  # share of a brief's cards reserved for spot_the_bug when it has leads (1 per 8)
  variant_min_reward: 0.6      # a story is retold in a new format only if its best reward is this high (or liked)
  variant_after_days: 14       # ...and its last card is at least this old
  variant_max_share: 0.2       # at most this share of a brief's cards are variants
  intro_share: 0.25            # at least this share of a brief's cards intro the least-known dirs (explain from zero)
  scout_max: 60                # unrated candidates one scout_status call hands out
  scout_batch: 15              # candidates per scout subagent (haiku rates them)
  require_facts: false         # true: reject (fact_missing) a card whose backticked identifier in hook, learn, or the first explain is neither covered by a listed fact nor in the cited code; false: only warn in the submit result
  require_claim_sources: false # true: reject (claim_unsourced) a card whose why-sentence in the first explain has no interpretive claim or fact behind it, or whose claim does not match its source; false: only warn
  claim_checks: true           # reject cards whose numbers, dates, shas, or names git does not back
analysis:
  history_window_days: 720     # relative to the ref's last commit date
  churn_windows_days: [30, 90, 365]
  blame_max_files: 50
  blame_max_bytes: 2000000
  todo_max_hits: 150
  candidates_per_tag: 40       # code candidates kept per tag (long_function, smell, ...) per repo
  candidate_max_file_bytes: 200000  # candidate miners skip bigger files
  candidate_max_files: 4000    # candidate miners read at most this many files per repo
  fetch_min_interval_s: 900    # a repo with `fetch: true` is fetched at most once in this many seconds
  facts_max_files: 4000        # syntax facts: files read at head
  facts_max_commits: 300       # syntax facts: newest commits mapped to definitions
  facts_max_defs: 100000       # syntax facts: rows kept per repo, per table
  facts_max_calls: 400000
  facts_max_blob_bytes: 200000 # syntax facts: bigger files are not parsed
  why_min_words: 25            # commit bodies this long are attached as "why" evidence
  git_timeout_s: 120           # seconds one read-only git call may run before it is stopped (raise it for a very large repo; fetch and clone have their own limits)
research:
  max_output_bytes: 200000
  max_read_lines: 300
  redact_secrets: true         # mask secrets in repo text sent out (JWTs, keys, ...); false is UNSAFE
render:
  # auto: Codex uses its native image tool; Claude uses mflux when installed. Missing mflux
  # always falls back to the agent. agent/local override the harness default.
  image_backend: auto
  # With the Python backend, the feed server downloads this pre-quantized model into
  # data/models/ by itself. Agent rendering never starts that download.
  mflux_model: z-image-turbo
  mflux_repo: filipstrand/Z-Image-Turbo-mflux-4bit
  mflux_revision: b3a8f31115a11f2f9e2fa0bfbc8d78dcc3e6568b
  mflux_auto_download: true    # false: download only with `gittok images --download`
  mflux_path: ""               # a saved model folder of your own; empty = data/models/<repo name>
  max_illustrations_per_run: 6
  mflux_steps: 9               # inference steps per illustration (the model card says 9)
  mflux_low_ram: true          # bound temporary MLX caches; retain model weights for the batch
  mflux_timeout_s: 120         # one image, once the model is loaded; a stuck render is killed
  mflux_load_timeout_s: 600    # loading the model, once per batch
  mflux_batch_idle_s: 10       # reuse the loaded model until no more images arrive for this long
  image_width: 768             # illustration size in pixels
  image_height: 960
  meme_source: https://raw.githubusercontent.com/jacebrowning/memegen/main  # where `gittok memes --prefetch` gets meme templates
  worker_interval_s: 5.0       # how often the render worker looks for pending cards
repos:
  # An optional limit for the add_repo MCP tool (an agent calls it). Empty = no limit: the
  # tool accepts any git repo root, and the permission prompt of Claude Code is your consent.
  # With a list, the tool only accepts a repo root inside one of these directories. Set it
  # in local/settings.yaml, for example: allowed_roots: [~/src, ~/work]
  # `gittok repos add <name> <path>` in a terminal is your own act: the list does not apply.
  # A repo added by URL is cloned into GitTok's home directory (repos/<name>); the list
  # does not apply to it.
  allowed_roots: []
gc:
  seen_after_cards: 20         # delete a seen (rewarded), unliked, unsaved card once this many other cards were shown after it
  liked_after_days: 90         # same for a liked card
  unseen_after_days: 45        # delete a card never shown, this long after it was made
  failed_after_days: 7         # delete a render_failed card this long after it was made
  srs_keep_days: 60            # keep a card with an unmastered quiz review due within this many days
  events_after_days: 90        # delete old events once their impression has a reward
  run_files_after_days: 30     # delete data/runs/<id>/ this long after the run ended
  social_after_days: 30        # delete seen story views and read notifications
  log_max_kb: 1024             # a data/logs/*.log file over this size keeps its newest half
  leads_after_days: 180        # delete leads not seen at HEAD this long that no card ever covered
  interval_s: 3600             # how often the server runs a pass
user:
  git_identities: []           # author names you commit under, as git history shows them; set in local/settings.yaml
profiles:
  max_hits: 200                # save_profile refuses a rule with more hits than this
  max_ms: 5000                 # ...or one that runs longer than this
