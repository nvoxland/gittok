# Secret detector patterns (src/codescroll/secrets.py). Repo text that leaves the server
# (research tools, materials, scout windows, profiling samples, card code) goes through
# these first; a match becomes `<redacted: N chars>`. Cards whose prose contains a match are
# rejected as secret_in_card.
#
# Each pattern has:
#   name        label for the finding
#   regex       Python regex (multi-line allowed with the "s" flag)
#   flags       optional string of i / s / m
#   group       which group is replaced; default 0 (the whole match)
#   min_length  the replaced text must be at least this long (default 0)
#   min_entropy the replaced text must have at least this Shannon entropy in bits per
#               character (default 0)
#
# Lines of a multi-line match are replaced one by one, so line numbers stay stable. A
# continuation line keeps the prefix that `keep_prefix` matches (a line number or a diff mark).

keep_prefix: '^(?:\d+[\t:] ?|[+-])'

patterns:
  - name: jwt
    regex: 'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
  - name: aws_access_key_id
    regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
  - name: private_key_block
    # A block whose END line is missing (a window cut inside it) runs to the end of the text.
    regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----(?:.*?-----END [A-Z ]*PRIVATE KEY-----|.*\Z)'
    flags: s
  - name: stripe_key
    regex: '\b[sr]k_live_[0-9A-Za-z]{10,}'
  - name: github_token
    regex: '\bgh[pous]_[A-Za-z0-9]{30,}|\bgithub_pat_[A-Za-z0-9_]{20,}'
  - name: slack_token
    regex: '\bxox[abpr]-[A-Za-z0-9-]{10,}'
  - name: google_api_key
    regex: '\bAIza[0-9A-Za-z_-]{35}'
  - name: secret_assignment
    # key name (token, secret, password, ...) then a quoted value of 20+ characters without
    # spaces and with high entropy. Only the value is replaced; the key and quotes stay.
    regex: >-
      (?:token|secret|password|passwd|api[_-]?key|private[_-]?key)[\w.\-]{0,40}["']?(?:\s*(?:=>|:=|[:=])\s*|\s+)(["'])(?P<value>[^\s"']{20,})\1
    flags: i
    group: value
    min_length: 20
    min_entropy: 3.5
