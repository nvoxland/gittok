# Shipped prior (SPEC §13): the mix before the feed has learned anything. The feed learns
# your taste from what you read; a rule ("less memes") steers it. To start from another mix,
# write the keys you change to local/defaults.yaml (docs/config.md).
categories:
  git_drama: 0.25
  memes: 0.20
  illustrated_explainers: 0.20
  code: 0.15
  interactive: 0.10
  cross_repo_and_recent: 0.10

tones:
  wholesome-nerdy: 0.20
  dry-deadpan: 0.20
  roast: 0.15
  hype: 0.15
  chaotic-absurd: 0.15
  earnest-teacher: 0.15

visual_mix:
  # Share of a packet's cards that should use an image format (meme, illustration, comic,
  # chart, diagram). A soft target: it counts only formats that can be drawn, so with no
  # image renderer it asks for charts and diagrams, which the client draws.
  image_min_share: 0.5
