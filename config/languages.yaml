# Per-language regex patterns for the candidate miners (src/gittok/candidates.py).
# All patterns are Python regexes, matched line by line.
#
# How a file is read, best first:
#   1. tree-sitter, when its language has a query in config/queries/ and the grammar is
#      downloaded: definitions, parameters, nesting, branches, imports and comments.
#   2. the entry here: function starts and imports by regex (used when 1 cannot read the file),
#      and the things only a regex finds, with or without tree-sitter: entry points, skipped
#      tests, catch-all handlers, sleeps, regex literals, bit operations, metaprogramming.
#   3. neither: plain text rules (comment markers, long lines, deep indentation).
#
# The patterns name public frameworks and standard libraries only. A macro or a convention of
# one project belongs in that repo's profile (local/profiles/<repo>.yaml), not here.
# To change or add a language for all your repos, write local/languages.yaml (docs/config.md).
#
# `thresholds` are the defaults; a language may override any of them under its own
# `thresholds` key.
thresholds:
  long_function: 50        # lines
  deep_nesting: 5          # levels
  many_params: 6
  many_branches: 12
  long_line: 160           # characters
  big_literal: 30          # lines
  magic_numbers: 6         # per file
  commented_out: 4         # consecutive lines
  min_fan_in: 2            # imported by at least this many files to count as core
  stable_fan_in: 3
  god_fan_out: 5           # imports at least this many files
  stable_days: 365
  tested_jaccard: 0.6
  regex_min_len: 8

# Line shapes that hold for most languages. A language below may set any of these keys itself;
# a language known only to the structure layer (config/queries) uses these as they are.
shared:
  comment: "#"
  # lines whose numbers are not magic numbers: a named constant, an import
  magic_exempt:
    - '^\s*(?:export\s+)?(?:const\s+)?[A-Z][A-Z0-9_]*\s*[:=]'
    - '^\s*(?:import |from |\(ns )'
  # the line that opens a multi-line literal
  big_literal_start: '^\s*(?:[\w.]+\s*(?::[^=]+)?=|(?:export\s+)?(?:const|let|var)\s+\w+[^=]*=|return)\s*[\{\[]\s*$'
  # a call of a function to itself; {name} is the function name
  self_call: '(?<![\w.$]){name}\s*\(|\b(?:self|this|cls)\.{name}\s*\('
  param_open: "("                              # opens the parameter list
  param_skip: [self, cls, "*", "/", "**", "&"]   # not counted as parameters
  nesting_skip: ["#", "//", "*", "/*"]         # a line that starts so opens no nesting level
  directive_prefixes: ["#!", "#:", "#["]       # a comment line that starts so is not commented-out code
  comment_strip: "#/;* "                       # characters removed from the start of a comment for display

languages:
  python:
    extensions: [.py]
    comment: "#"
    block: indent
    func_start: '^\s*(?:async\s+)?def\s+(\w+)'
    entry_points:
      - '^\s*@\w+(?:\.\w+)*\.(?:route|get|post|put|delete|patch|websocket|command|task|periodic_task|scheduled_job)\b'
      - '^\s*@(?:click\.(?:command|group)|shared_task|app\.task)\b'
      - '^if\s+__name__\s*==\s*[''"]__main__[''"]'
      - '^(?:async\s+)?def\s+(?:main|handler|lambda_handler)\('
    entry_paths: ['(^|/)migrations?/', '(^|/)__main__\.py$']
    import_style: dotted
    imports:
      - '^\s*from\s+([.\w]+)\s+import\s+([\w, ]+)'
      - '^\s*import\s+([\w.]+)'
    # more definition lines beside func_start (used to find the names a lead defines)
    def_patterns:
      - '^\s*class\s+(\w+)'
    public: '^(?:async\s+)?(?:def|class)\s+([A-Za-z]\w*)'
    branch: '\b(?:if|elif|for|while|except|case|and|or)\b'
    skipped_test:
      - '@(?:pytest\.mark\.(?:skip|skipif|xfail)|unittest\.(?:skip|skipIf|skipUnless|expectedFailure))\b'
      - '\bpytest\.skip\('
    catch_all:
      - '^\s*except\s*:'
      - '^\s*except\s+(?:Base)?Exception\b[^:]*:'
    sleep: '\b(?:time|asyncio)\.sleep\('
    regex_literal: '\bre\.\w+\(\s*[rbuf]*([''"])(.{8,}?)\1'
    bit_ops: '[\w)\]]\s*(?:<<|>>)\s*[\w(]|\w\s+&\s+\w|\w\s+\^\s+\w|~\w'
    meta:
      - '\bmetaclass\s*='
      - '\bdef\s+(?:__getattr__|__getattribute__|__init_subclass__|__set_name__)\b'
      - '\b(?:exec|eval)\('
      - '\bsetattr\('
    commented_code: '^\s*(?:[\w.\[\]]+\s*=[^=]|(?:def|class|return|import|from|if|for|while|print|raise|with)\b|[\w.]+\(.*\)$)'
    thresholds:
      god_fan_out: 8

  clojure:
    extensions: [.clj, .cljs, .cljc, .bb]
    comment: ";"
    block: parens
    big_literal_start: '^\s*\((?:def|defonce)\s'
    self_call: '\(\s*{name}[\s)]'
    param_open: "["
    func_start: '^\s*\((?:defn|defn-|defmacro|defmulti|defmethod)\s+(?:\^\S+\s+)*([^\s\[\]()]+)'
    entry_points:
      - '^\s*\(defroutes\b'
      - '^\s*\(\s*(?:[\w.]+/)?(?:GET|POST|PUT|DELETE|PATCH)\s+"/'
      - '^\s*\(defn\s+-main\b'
      - '^\s*\(\s*(?:[\w.]+/)?defjob\b'
    entry_paths: ['(^|/)migrations?/', '(^|/)core\.cljs?$']
    import_style: dotted
    imports:
      - '\[([a-zA-Z][\w.\-]*)\s+:(?:as|refer|only|exclude|rename)\b'
      - '\(:require\s+\[?([a-zA-Z][\w.\-]*\.[\w.\-]+)\]?'
    def_patterns:
      - '^\s*\((?:def|defonce|defprotocol|defrecord|deftype)\s+(?:\^\S+\s+)*([^\s\[\]()]+)'
    public: '^\((?:defn|def|defmacro|defmulti|defprotocol|defrecord|deftype)\s+(?:\^\S+\s+)*([^\s^\-][^\s()\[\]]*)'
    branch: '\((?:if|if-not|if-let|if-some|when|when-not|when-let|when-some|cond|condp|case|and|or|catch)[\s)]'
    skipped_test:
      - '\^:(?:skip|ignore|disabled)\b'
      - '#_\s*\(deftest\b'
    catch_all:
      - '\(catch\s+(?:Throwable|Exception|java\.lang\.(?:Throwable|Exception)|:default)\b'
    sleep: 'Thread/sleep\b'
    regex_literal: '#"((?:\\.|[^"\\]){8,})"'
    bit_ops: '\((?:unsigned-)?bit-(?:and|or|xor|not|shift-left|shift-right|flip|test|set|clear)\b'
    meta:
      - '^\s*\(defmacro\b'
      - '~@'
      - '\((?:eval|resolve|intern|alter-var-root|with-redefs)\b'
    commented_code: '^\s*\('
    thresholds:
      deep_nesting: 12   # paren depth, not indentation
      long_function: 60
      god_fan_out: 15

  typescript:
    extensions: [.ts, .tsx, .js, .jsx, .mjs, .cjs, .svelte]
    comment: "//"
    comment_also: ["*", "/*"]   # lines inside a block comment
    block: indent
    func_start: '^\s*(?:export\s+)?(?:default\s+)?(?:async\s+)?(?:function\s*\*?\s*(\w+)|(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s*)?(?:function\b|\())'
    entry_points:
      - '\b(?:app|router|server|api)\.(?:get|post|put|delete|patch|use|all)\('
      - '^\s*export\s+(?:async\s+)?(?:function|const)\s+(?:GET|POST|PUT|DELETE|PATCH|load|actions|handle)\b'
      - '\.command\('
      - '\bcron\.schedule\('
      - '^#!/usr/bin/env node'
    entry_paths: ['(^|/)migrations?/', '(^|/)\+server\.\w+$', '(^|/)hooks\.server\.\w+$', '(^|/)pages/api/', '(^|/)route\.[jt]sx?$']
    import_style: path
    imports:
      - '^\s*import\s[^''"]*?[''"]([^''"]+)[''"]'
      - '^\s*export\s[^''"]*?from\s+[''"]([^''"]+)[''"]'
      - '\brequire\(\s*[''"]([^''"]+)[''"]\s*\)'
      - '\bimport\(\s*[''"]([^''"]+)[''"]\s*\)'
    def_patterns:
      - '^\s*(?:export\s+)?(?:default\s+)?(?:abstract\s+)?(?:class|interface|enum)\s+(\w+)'
      - '^\s*export\s+(?:const|let|var)\s+(\w+)'
    public: '^export\s+(?:default\s+)?(?:async\s+)?(?:function\*?|class|const|let|interface|type|enum)\s+(\w+)'
    branch: '\b(?:if|else if|for|while|case|catch)\b|&&|\|\||\?\s'
    skipped_test:
      - '\b(?:it|test|describe)\.(?:skip|todo)\('
      - '\b(?:xit|xtest|xdescribe)\('
    catch_all:
      - 'catch\s*(?:\(\s*\w*\s*\))?\s*\{\s*\}'
    sleep: '\b(?:sleep|delay|setTimeout)\(\s*[\w.]*\s*,?\s*\d{3,}'
    regex_literal: '(?:[=(,:!&|?]|return)\s*/(?![/*])((?:\\.|\[[^\]]*\]|[^/\n\\\[]){8,})/[gimsuy]*'
    bit_ops: '[\w)\]]\s*(?:<<|>>>?)\s*[\w(]|\|\s*0\b|~~\w'
    meta:
      - '\bnew\s+Proxy\('
      - '\bReflect\.\w+\('
      - '\beval\('
      - '\bnew\s+Function\('
    commented_code: '^\s*(?:[\w.\[\]]+\s*=[^=]|(?:const|let|var|function|return|import|export|if|for|while|await)\b|[\w.]+\(.*\);?$|[})\]];?$)'
    thresholds:
      big_literal: 40
      god_fan_out: 12

  go:
    extensions: [.go]
    comment: "//"
    comment_also: ["*", "/*"]
    block: indent
    func_start: '^func\s+(?:\([^)]*\)\s*)?(\w+)\s*[(\[]'
    entry_points:
      - '^func\s+main\s*\('
      - '\b\w+\.(?:HandleFunc|Handle|GET|POST|PUT|DELETE|PATCH)\(\s*"'
      - '\bcobra\.Command\s*\{'
    entry_paths: ['(^|/)cmd/[^/]+/main\.go$', '(^|/)migrations?/']
    imports:
      - '^\s*(?:import\s+)?(?:[\w.]+\s+)?"([^"]+)"\s*$'
    def_patterns:
      - '^type\s+(\w+)\s'
    public: '^(?:func\s+(?:\([^)]*\)\s*)?|type\s+)([A-Z]\w*)'
    branch: '\b(?:if|for|case|select)\b|&&|\|\|'
    skipped_test:
      - '\bt\.Skip(?:f|Now)?\('
    catch_all:
      - '\brecover\(\)'
    sleep: '\btime\.Sleep\('
    regex_literal: '\bregexp\.(?:MustCompile|Compile)(?:POSIX)?\(\s*[`"](.{8,}?)[`"]\s*\)'
    bit_ops: '[\w)\]]\s*(?:<<|>>|&\^)\s*[\w(]'
    meta:
      - '\breflect\.\w+\('
      - '\bunsafe\.Pointer\b'
    commented_code: '^\s*(?:[\w.\[\]]+\s*:?=[^=]|(?:func|return|if|for|var|const|type|defer|go)\b|[\w.]+\(.*\)$|[})\]]$)'

  rust:
    extensions: [.rs]
    comment: "//"
    comment_also: ["*", "/*"]
    block: indent
    func_start: '^\s*(?:pub(?:\([^)]*\))?\s+)?(?:(?:async|const|unsafe)\s+)*fn\s+(\w+)'
    entry_points:
      - '^\s*(?:pub\s+)?(?:async\s+)?fn\s+main\s*\('
      - '^\s*#\[(?:\w+::)*(?:main|get|post|put|delete|patch|route|command)\b'
    entry_paths: ['(^|/)src/main\.rs$', '(^|/)src/bin/', '(^|/)migrations?/']
    imports:
      - '^\s*(?:pub\s+)?use\s+([\w:]+)'
      - '^\s*(?:pub\s+)?mod\s+(\w+)\s*;'
    def_patterns:
      - '^\s*(?:pub(?:\([^)]*\))?\s+)?(?:struct|enum|trait|type|mod)\s+(\w+)'
    public: '^pub\s+(?:(?:async|const|unsafe)\s+)*(?:fn|struct|enum|trait|type|mod|const|static)\s+(\w+)'
    branch: '\b(?:if|else if|for|while|loop|match)\b|=>|&&|\|\|'
    skipped_test:
      - '^\s*#\[ignore\b'
    catch_all:
      - '\bcatch_unwind\('
      - '^\s*_\s*=>\s*(?:\{\s*\}|\(\))\s*,?\s*$'
    sleep: '\b(?:thread::sleep|time::sleep|sleep)\('
    regex_literal: '\bRegex::new\(\s*r?#*"(.{8,}?)"#*\s*\)'
    bit_ops: '[\w)\]]\s*(?:<<|>>)\s*[\w(]|\w\s+\^\s+\w'
    meta:
      - '^\s*macro_rules!'
      - '\bunsafe\s*\{'
      - '\btransmute\b'
      - '#\[proc_macro'
    commented_code: '^\s*(?:let\s|(?:fn|pub|use|return|if|for|while|match|impl|struct)\b|[\w.:]+\(.*\);?$|[})\]];?$)'

  java:
    extensions: [.java]
    comment: "//"
    comment_also: ["*", "/*"]
    block: indent
    # a method: at least one modifier, a return type, a name, an open parenthesis
    func_start: '^\s+(?:(?:public|protected|private|static|final|abstract|synchronized|native|default)\s+)+(?!(?:class|interface|enum|record|new|return)\b)(?:<[^>]+>\s+)?[\w.<>\[\],? ]+?\s+(\w+)\s*\([^;]*$'
    entry_points:
      - '^\s*public\s+static\s+void\s+main\s*\('
      - '^\s*@(?:GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping|GET|POST|PUT|DELETE|PATCH|Path|Scheduled|KafkaListener|RabbitListener|EventListener|WebServlet)\b'
      - '^\s*@(?:RestController|Controller|SpringBootApplication)\b'
    entry_paths: ['(^|/)migrations?/']
    imports:
      - '^\s*import\s+(?:static\s+)?([\w.]+?)(?:\.\*)?\s*;'
    def_patterns:
      - '^\s*(?:(?:public|protected|private|static|final|abstract|sealed)\s+)*(?:class|interface|enum|record)\s+(\w+)'
    public: '^public\s+(?:(?:static|final|abstract|sealed)\s+)*(?:class|interface|enum|record)\s+(\w+)'
    branch: '\b(?:if|else if|for|while|case|catch)\b|&&|\|\||\?\s'
    skipped_test:
      - '^\s*@(?:Disabled|Ignore)\b'
    catch_all:
      - '\bcatch\s*\(\s*(?:final\s+)?(?:Exception|Throwable)\s+\w+\s*\)'
    sleep: '\b(?:Thread\.sleep|TimeUnit\.\w+\.sleep)\('
    regex_literal: '\bPattern\.compile\(\s*"((?:\\.|[^"\\]){8,})"'
    bit_ops: '[\w)\]]\s*(?:<<|>>>)\s*[\w(]|\w\s+\^\s+\w|\w\s+&\s+0x'
    meta:
      - '\.getDeclared(?:Method|Field|Constructor)s?\('
      - '\bClass\.forName\('
      - '\bProxy\.newProxyInstance\('
      - '\.setAccessible\(true\)'
    commented_code: '^\s*(?:[\w.<>\[\]]+\s+\w+\s*=[^=]|(?:return|if|for|while|import|public|private|protected|try|throw)\b|[\w.]+\(.*\);$|[})\]];?$)'

  ruby:
    extensions: [.rb, .rake]
    comment: "#"
    block: indent
    func_start: '^\s*def\s+(?:self\.)?([\w?!]+)'
    entry_points:
      - '^\s*(?:get|post|put|patch|delete)\s+[''"]/'
      - '^\s*(?:resources?|namespace|root)\s+[:''"]'
      - '^\s*task\s+[:''"]?\w'
      - '^\s*include\s+Sidekiq::(?:Worker|Job)\b'
      - '^if\s+__FILE__\s*==\s*\$(?:0|PROGRAM_NAME)'
    entry_paths: ['(^|/)db/migrate/', '(^|/)config/routes\.rb$']
    imports:
      - '^\s*require_relative\s+[''"]([^''"]+)[''"]'
      - '^\s*require\s+[''"]([^''"]+)[''"]'
    def_patterns:
      - '^\s*(?:class|module)\s+([A-Z][\w:]*)'
    public: '^(?:class|module)\s+([A-Z][\w:]*)'
    branch: '\b(?:if|elsif|unless|while|until|when|rescue)\b|&&|\|\|'
    skipped_test:
      - '^\s*(?:xit|xdescribe|xcontext|pending|skip)\b'
      - '\b(?:it|describe|context)\b.*\bskip:\s'
    catch_all:
      - '^\s*rescue\s*(?:=>\s*\w+)?\s*$'
      - '^\s*rescue\s+(?:Exception|StandardError)\b'
      - '\brescue\s+nil\b'
    sleep: '(?<![\w.])sleep[\s(]+\d'
    regex_literal: '(?:=~|!~|[=(,])\s*/((?:\\.|[^/\n\\]){8,})/[imxo]*'
    bit_ops: '[\w)\]]\s*>>\s*\d|\w\s+\^\s+\w|\w\s+&\s+0x'
    meta:
      - '\bdefine_method\b'
      - '\bmethod_missing\b'
      - '\b(?:instance|class|module)_eval\b'
      - '\bsend\(\s*:'
      - '\bconst_get\('
    commented_code: '^\s*(?:[\w.@\[\]]+\s*=[^=~]|(?:def|class|module|return|require|if|unless|end|puts|raise)\b|[\w.]+\(.*\)$)'

  # The languages below have no tags query in config/queries/: these patterns are all GitTok
  # knows about them. A repo profile can add a query for one repo (profile `queries`), and
  # local/queries/ can add one for all your repos.
  kotlin:
    extensions: [.kt, .kts]
    comment: "//"
    comment_also: ["*", "/*"]
    block: indent
    func_start: '^\s*(?:(?:public|private|protected|internal|override|open|abstract|final|suspend|inline|operator|infix|tailrec|external|actual|expect)\s+)*fun\s+(?:<[^>]+>\s+)?(?:[\w.<>?]+\.)?(\w+)\s*\('
    entry_points:
      - '^\s*(?:suspend\s+)?fun\s+main\s*\('
      - '^\s*@(?:GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping|Scheduled|KafkaListener|EventListener)\b'
      - '^\s*(?:get|post|put|delete|patch|route)\s*\(\s*"/'
    entry_paths: ['(^|/)migrations?/']
    imports:
      - '^\s*import\s+([\w.]+?)(?:\.\*)?(?:\s+as\s+\w+)?\s*$'
    def_patterns:
      - '^\s*(?:(?:public|private|internal|protected|open|abstract|sealed|data|enum|inner|value|annotation)\s+)*(?:class|interface|object)\s+(\w+)'
    public: '^(?:(?:public|open|abstract|sealed|data|enum|suspend|inline)\s+)*(?:fun|class|interface|object)\s+(?:<[^>]+>\s+)?(\w+)'
    branch: '\b(?:if|else if|for|while|when|catch)\b|->|&&|\|\||\?:'
    skipped_test:
      - '^\s*@(?:Disabled|Ignore)\b'
    catch_all:
      - '\bcatch\s*\(\s*\w+\s*:\s*(?:Exception|Throwable)\s*\)'
      - '\brunCatching\s*\{'
    sleep: '\b(?:Thread\.sleep|delay)\('
    regex_literal: '\bRegex\(\s*"((?:\\.|[^"\\]){8,})"|"((?:\\.|[^"\\]){8,})"\.toRegex\(\)'
    bit_ops: '\b(?:shl|shr|ushr|xor)\b|\binv\(\)'
    meta:
      - '\.getDeclared(?:Method|Field)s?\('
      - '\bClass\.forName\('
      - '\breified\b'
    commented_code: '^\s*(?:(?:val|var|fun|return|if|for|while|import|when|class)\b|[\w.]+\(.*\)$|[})\]]$)'

  csharp:
    extensions: [.cs]
    comment: "//"
    comment_also: ["*", "/*"]
    block: indent
    func_start: '^\s+(?:(?:public|private|protected|internal|static|virtual|override|abstract|async|sealed|extern|unsafe|new|partial)\s+)+(?!(?:class|struct|record|interface|enum|delegate|event|return)\b)[\w.<>\[\],?() ]+?\s+(\w+)\s*(?:<[^>]+>)?\s*\([^;]*$'
    entry_points:
      - '^\s*(?:public\s+)?static\s+(?:async\s+)?(?:void|int|Task(?:<int>)?)\s+Main\s*\('
      - '^\s*\[(?:Http(?:Get|Post|Put|Delete|Patch)|Route|ApiController|Function|FunctionName)\b'
      - '\bapp\.Map(?:Get|Post|Put|Delete|Patch|Group)\('
    entry_paths: ['(^|/)Program\.cs$', '(^|/)Migrations?/']
    imports:
      - '^\s*(?:global\s+)?using\s+(?:static\s+)?(?:\w+\s*=\s*)?([\w.]+)\s*;'
    def_patterns:
      - '^\s*(?:(?:public|private|protected|internal|static|abstract|sealed|partial|readonly)\s+)*(?:class|interface|struct|enum|record)\s+(\w+)'
    public: '^\s*public\s+(?:(?:static|abstract|sealed|partial|readonly)\s+)*(?:class|interface|struct|enum|record)\s+(\w+)'
    branch: '\b(?:if|else if|for|foreach|while|case|catch)\b|&&|\|\||\?\?|\?\s'
    skipped_test:
      - '\[(?:Ignore|(?:Fact|Theory)\s*\(\s*Skip)\b'
      - '\bAssert\.(?:Ignore|Inconclusive)\('
    catch_all:
      - '\bcatch\s*(?:\(\s*(?:System\.)?Exception(?:\s+\w+)?\s*\))?\s*\{?\s*$'
    sleep: '\b(?:Thread\.Sleep|Task\.Delay)\('
    regex_literal: '\bRegex(?:\.\w+)?\((?:[^"\n]*,\s*)?@?"((?:\\.|[^"\\]){8,})"'
    bit_ops: '[\w)\]]\s*(?:<<|>>>)\s*[\w(]|\w\s+\^\s+\w|\w\s+&\s+0x'
    meta:
      - '\.GetMethod\('
      - '\.GetProperty\('
      - '\bActivator\.CreateInstance\('
      - '\bExpression\.Lambda\b'
    commented_code: '^\s*(?:(?:var|return|if|for|foreach|while|using|public|private|protected|try|throw)\b|[\w.<>\[\]]+\s+\w+\s*=[^=]|[\w.]+\(.*\);$|[})\]];?$)'

  php:
    extensions: [.php]
    comment: "//"
    comment_also: ["#", "*", "/*"]
    block: indent
    func_start: '^\s*(?:(?:public|private|protected|static|final|abstract)\s+)*function\s+&?(\w+)\s*\('
    entry_points:
      - '\bRoute::(?:get|post|put|patch|delete|any|match|resource|apiResource)\('
      - '^\s*#\[Route\('
      - '\$(?:app|router)->(?:get|post|put|patch|delete|map|group)\('
    entry_paths: ['(^|/)public/index\.php$', '(^|/)migrations?/']
    # `use Vendor\Name` names a class, not a file: only include and require paths resolve
    imports:
      - '\b(?:require|include)(?:_once)?\s*\(?\s*(?:__DIR__\s*\.\s*)?[''"]/?([^''"]+?)(?:\.php)?[''"]'
    def_patterns:
      - '^\s*(?:(?:abstract|final|readonly)\s+)*(?:class|interface|trait|enum)\s+(\w+)'
    public: '^(?:(?:abstract|final|readonly)\s+)*(?:class|interface|trait|enum|function)\s+(\w+)'
    branch: '\b(?:if|elseif|else if|for|foreach|while|case|catch)\b|&&|\|\||\?\?|\?\s'
    skipped_test:
      - '->markTest(?:Skipped|Incomplete)\('
    catch_all:
      - '\bcatch\s*\(\s*\\?(?:Exception|Throwable)\s+\$\w+\s*\)'
    sleep: '\b(?:sleep|usleep)\(\s*[\d$]'
    regex_literal: '\bpreg_\w+\(\s*[''"]((?:\\.|[^''"\\]){8,})[''"]'
    bit_ops: '[\w)\]]\s*(?:<<|>>)\s*[\w($]|\w\s+\^\s+[\w$]'
    meta:
      - '\bfunction\s+__(?:call|callStatic|get|set|invoke)\b'
      - '\bcall_user_func(?:_array)?\('
      - '\beval\('
      - '\bnew\s+Reflection\w+\('
    commented_code: '^\s*(?:\$[\w\[\]''">-]+\s*=[^=]|(?:function|return|if|foreach|for|while|echo|use|class|require|include)\b|[\w$>:-]+\(.*\);$|[})\]];?$)'

  swift:
    extensions: [.swift]
    comment: "//"
    comment_also: ["*", "/*"]
    block: indent
    func_start: '^\s*(?:@\w+(?:\([^)]*\))?\s+)*(?:(?:public|private|fileprivate|internal|open|static|class|final|override|mutating|nonisolated|required|convenience)\s+)*func\s+(\w+)\s*(?:<[^>]+>)?\s*\('
    entry_points:
      - '^\s*@(?:main|UIApplicationMain|NSApplicationMain)\b'
      - '\b(?:app|routes|router)\.(?:get|post|put|patch|delete|on)\('
      - '^\s*(?:static\s+)?func\s+main\s*\('
    entry_paths: ['(^|/)main\.swift$', '(^|/)Migrations?/']
    # an import names a module, not a file: it resolves only when a file has that name
    imports:
      - '^\s*(?:@testable\s+)?import\s+(?:(?:class|struct|enum|protocol|func)\s+)?([\w.]+)'
    def_patterns:
      - '^\s*(?:(?:public|private|fileprivate|internal|open|final|indirect)\s+)*(?:class|struct|enum|protocol|extension|actor)\s+(\w+)'
    public: '^(?:public|open)\s+(?:(?:final|static)\s+)*(?:class|struct|enum|protocol|actor|func|let|var)\s+(\w+)'
    branch: '\b(?:if|else if|guard|for|while|case|catch)\b|&&|\|\||\?\?'
    skipped_test:
      - '\bXCTSkip(?:If|Unless)?\('
      - '\.disabled\('
    catch_all:
      - '\bcatch\s*\{'
    sleep: '(?<![\w.])(?:sleep|usleep)\(|\b(?:Thread|Task)\.sleep\('
    regex_literal: '\b(?:NSRegularExpression\(\s*pattern:|Regex\()\s*#?"((?:\\.|[^"\\]){8,})"'
    bit_ops: '[\w)\]]\s*(?:<<|>>)\s*[\w(]|\w\s+\^\s+\w|\w\s+&\s+0x'
    meta:
      - '\bMirror\(reflecting:'
      - '\bunsafeBitCast\('
      - '@dynamicMemberLookup\b'
      - '\bNSClassFromString\('
    commented_code: '^\s*(?:(?:let|var|func|return|if|guard|for|while|import|class|struct)\b|[\w.]+\(.*\)$|[})\]]$)'
