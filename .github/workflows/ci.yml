name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Download the code grammars
        run: |
          uv run python -c "from gittok import structure; structure.download(sorted(structure.spec()['languages']))" \
            || echo "::warning::grammar download failed; the tests that need a grammar will skip"

      # -v names each test, and faulthandler prints every stack if one test runs
      # longer than two minutes, so a hang shows where it is.
      - name: Python tests
        timeout-minutes: 15
        run: uv run pytest -n auto -v -o faulthandler_timeout=120

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Web tests
        run: npm --prefix web test

      - name: Web build
        run: npm --prefix web run build

      - name: Build the wheel
        run: uv build --wheel
