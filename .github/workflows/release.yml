name: Release

# Runs when a version tag is pushed: `git tag v1.2.3 && git push origin v1.2.3`.
# DEV.md, "Release", has the steps and the one-time setup.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read  # a job that needs more says so itself

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: The tag must match the version in both files
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          in_pyproject="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          in_package="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/gittok/__init__.py | head -n 1)"
          ok=1
          if [ "$in_pyproject" != "$version" ]; then
            echo "::error file=pyproject.toml::The tag is $TAG, but pyproject.toml has version \"$in_pyproject\". Set version = \"$version\" in pyproject.toml, or push the right tag."
            ok=0
          fi
          if [ "$in_package" != "$version" ]; then
            echo "::error file=src/gittok/__init__.py::The tag is $TAG, but src/gittok/__init__.py has __version__ \"$in_package\". Set __version__ = \"$version\" in src/gittok/__init__.py, or push the right tag."
            ok=0
          fi
          [ "$ok" = 1 ]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci-passed:
    # The macOS tests run once per commit, in CI (ci.yml). A second macOS job here would
    # compete for GitHub's few hosted macOS arm64 runners; one that gets no runner in about
    # 15 minutes is cancelled. So this job waits for the CI run of the tagged commit.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: CI passed on the tagged commit
        run: |
          url="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push"
          while :; do
            run="$(gh api "$url" --jq '.workflow_runs[0] // empty')"
            if [ -z "$run" ]; then
              if [ "$SECONDS" -gt 300 ]; then
                echo "::error::No CI run for $GITHUB_SHA. Push main with this commit first, then the tag (DEV.md, Release)."
                exit 1
              fi
            else
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r .conclusion <<<"$run")"
              link="$(jq -r .html_url <<<"$run")"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "CI passed: $link"
                  exit 0
                fi
                echo "::error::CI for $GITHUB_SHA ended with '$conclusion': $link. Fix it, or rerun that CI run if it was cancelled, then rerun this job."
                exit 1
              fi
              echo "CI is $status: $link"
            fi
            sleep 30
          done

  build:
    # The wheel is pure Python (py3-none-any), so Linux builds it.
    runs-on: ubuntu-latest
    needs: validate-version
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build the web app
        run: npm --prefix web run build

      # `uv build` makes the sdist, then the wheel from that sdist. The build hook stops
      # when web/build/index.html is missing, so a wheel proves that the sdist carries it.
      - name: Build the sdist and the wheel
        run: uv build

      - name: Check what the sdist and the wheel hold
        run: |
          ls -l dist
          test -f "dist/gittok-$VERSION.tar.gz"
          test -f "dist/gittok-$VERSION-py3-none-any.whl"
          tar -tzf "dist/gittok-$VERSION.tar.gz" | grep -q "^gittok-$VERSION/web/build/index.html$" \
            || { echo "::error::The sdist does not hold web/build/index.html."; exit 1; }
          unzip -Z1 "dist/gittok-$VERSION-py3-none-any.whl" | grep -q "^gittok/_bundled/web/index.html$" \
            || { echo "::error::The wheel does not hold gittok/_bundled/web/index.html."; exit 1; }

      - name: Smoke test the wheel in a fresh environment
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "dist/gittok-$VERSION-py3-none-any.whl"
          got="$("$RUNNER_TEMP/smoke/bin/gittok" --version)"
          echo "$got"
          [ "$got" = "gittok $VERSION" ] \
            || { echo "::error::gittok --version printed \"$got\", expected \"gittok $VERSION\"."; exit 1; }

      - name: Make a GitTok directory with the wheel
        run: |
          gittok="$RUNNER_TEMP/smoke/bin/gittok"
          home="$RUNNER_TEMP/gittok-home"
          "$gittok" init "$home"
          for f in gittok.yaml .mcp.json CLAUDE.md .gitignore local/repos.yaml \
                   .claude/settings.json \
                   .claude/skills/gittok-generate/SKILL.md \
                   .claude/skills/gittok-steer/SKILL.md \
                   .claude/skills/gittok-profile-repo/SKILL.md \
                   .claude/agents/gittok-writer.md \
                   .claude/agents/gittok-scout.md; do
            test -f "$home/$f" || { echo "::error::gittok init did not write $f."; exit 1; }
          done
          if "$gittok" init "$home"; then
            echo "::error::gittok init accepted a directory that is not empty."; exit 1
          fi
          (cd "$home" && "$gittok" repos && "$gittok" update)
          if (cd "$RUNNER_TEMP" && "$gittok" repos); then
            echo "::error::gittok ran outside a GitTok directory."; exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [validate-version, ci-passed, build]
    environment:
      name: pypi
      url: https://pypi.org/p/gittok
    permissions:
      id-token: write  # PyPI trusted publishing: no token (DEV.md, "Release")
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    runs-on: ubuntu-latest
    needs: [validate-version, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ needs.validate-version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          body: |
            Install:

            ```bash
            uv tool install 'gittok[images]==${{ needs.validate-version.outputs.version }}'
            gittok init ~/gittok
            cd ~/gittok
            claude
            ```

            Without illustrated cards (a smaller install):

            ```bash
            uv tool install gittok==${{ needs.validate-version.outputs.version }}
            ```
